<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>faw — note</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000}
body{min-height:100vh;min-height:100svh;overflow:hidden;color:#f5f5f5;display:flex;align-items:center;justify-content:center;padding:28px;font-family:Georgia,"Times New Roman",serif}
body:before{content:"";position:fixed;width:55vw;height:55vw;max-width:520px;max-height:520px;border-radius:50%;background:#fff;opacity:.025;filter:blur(100px);animation:breathe 7s ease-in-out infinite;pointer-events:none}
main{width:min(760px,100%);text-align:center;position:relative;z-index:1}
.number{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.38em;opacity:0;margin-bottom:34px}
blockquote{margin:0;font-size:clamp(28px,6vw,52px);line-height:1.18;font-weight:400;letter-spacing:-.025em}
.word{display:inline-block;opacity:0;transform:translateY(18px);filter:blur(6px);margin-right:.22em}
.author{margin-top:34px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.28em;text-transform:lowercase;opacity:0}
.line{width:0;height:1px;background:#f5f5f5;opacity:.35;margin:18px auto 0}
.start{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1s ease}
.start span{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.35em;text-transform:uppercase;opacity:.6;animation:pulse 2s ease-in-out infinite}
.started .start{opacity:0;pointer-events:none}
.started .number{animation:reveal .9s cubic-bezier(.22,1,.36,1) .15s forwards}
.started .word{animation:wordIn 1s cubic-bezier(.22,1,.36,1) forwards}
.started .author{animation:reveal 1s cubic-bezier(.22,1,.36,1) 2.7s forwards}
.started .line{animation:lineIn 1.1s cubic-bezier(.22,1,.36,1) 3s forwards}
.music{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2;font:9px Arial,sans-serif;letter-spacing:.22em;opacity:0;transition:opacity 1s ease;text-transform:uppercase}
.started .music{opacity:.3}
@keyframes wordIn{to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes reveal{to{opacity:.55}}
@keyframes lineIn{to{width:34px}}
@keyframes breathe{0%,100%{transform:scale(.85);opacity:.018}50%{transform:scale(1.12);opacity:.035}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
@media(prefers-reduced-motion:reduce){body:before,.start span{animation:none}}
</style>
</head>
<body>
<div class="start" id="start"><span>tap to enter</span></div>

<main>
<div class="number">01</div>
<blockquote aria-label="a man's ego will cost him the love of his life">
<span class="word" style="animation-delay:.45s">“a</span>
<span class="word" style="animation-delay:.58s">man’s</span>
<span class="word" style="animation-delay:.71s">ego</span>
<span class="word" style="animation-delay:.84s">will</span>
<span class="word" style="animation-delay:.97s">cost</span>
<span class="word" style="animation-delay:1.10s">him</span>
<span class="word" style="animation-delay:1.23s">the</span>
<span class="word" style="animation-delay:1.36s">love</span>
<span class="word" style="animation-delay:1.49s">of</span>
<span class="word" style="animation-delay:1.62s">his</span>
<span class="word" style="animation-delay:1.75s">life”</span>
</blockquote>
<div class="author">— faw</div>
<div class="line"></div>
</main>

<div class="music">♪ mrs magic — intro</div>
<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script>
const start = document.getElementById('start');
const music = document.getElementById('music');

start.addEventListener('click', async () => {
  document.body.classList.add('started');
  try {
    music.volume = 0.45;
    await music.play();
  } catch(e) {}
});
</script>
</body>
</html>
