<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faw — note</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      background: #000;
      color: #f5f5f5;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 28px;
    }
    main {
      width: min(760px, 100%);
      text-align: center;
      animation: fade 1.4s ease both;
    }
    .number {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .28em;
      opacity: .42;
      margin-bottom: 34px;
    }
    blockquote {
      margin: 0;
      font-size: clamp(28px, 6vw, 52px);
      line-height: 1.18;
      font-weight: 400;
      letter-spacing: -.02em;
    }
    .author {
      margin-top: 34px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: lowercase;
      opacity: .55;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <div class="number">01</div>
    <blockquote>
      “a man’s ego will cost him the love of his life”
    </blockquote>
    <div class="author">— faw</div>
  </main>
</body>
</html>
